name: Build HR EPG

on:
  schedule:
    - cron: "15 3,15 * * *"   # twice a day
  workflow_dispatch:
  push:
    paths: ["build_epg.py", "channels.json"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_epg.py
      - name: Commit EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hr.xml.gz matches.txt missing.txt
          git commit -m "Update EPG $(date -u +%F_%H%M)" || exit 0
          git push
